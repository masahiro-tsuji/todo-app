name: WEB CD（Deploy）

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  web-deploy:
    name: WEB - Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: web-deploy
      cancel-in-progress: true
    steps:
      # AWS認証情報の設定 (Settingsで設定した値を使用)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # アーティファクトのダウンロード
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-out # artifactの名前
          path: web/out/ # 展開するパス
      # S3にSync
      - name: Sync to S3
        working-directory: web
        run: aws s3 sync out/ s3://${{ vars.S3_BUCKET_NAME }}/ --delete
      # CloudFrontのInvalidation
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"