name: WEB CI (Test, Build) / CD

on:
  push:
    branches: [ "develop" ]
    paths:
      - web/**
  pull_request:
    branches: [ "develop" ]
    paths:
      - web/**


jobs:
    web-test-and-build:
        name: Web Container - Test and Build
        runs-on: ubuntu-latest
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
        timeout-minutes: 10
        steps:
            # コードのチェックアウト
            - name: Checkout code
              uses: actions/checkout@v6
            # NodeJsのセットアップ
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "22" # Dockerfileと合わせる
                cache: "npm" # 毎回npm ciしないようにキャッシュ
                cache-dependency-path: web/package-lock.json
            # node_modulesのインストール
            - name: Run npm ci
              working-directory: web
              run: npm ci
            # Biome
            - name: Run Lint
              working-directory: web
              run: npm run lint
            # Jestの実行
            - name: Run Test
              working-directory: web
              run: npm test
            # Build
            - name: Run Build
              working-directory: web
              run: npm run build
            # アーティファクトのアップロード
            - name: Upload web artifact
              uses: actions/upload-artifact@v4
              if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
              with:
                name: web-out
                path: web/out/
    web-deploy:
      name: WEB - Deploy
      needs: web-test-and-build
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      permissions:
        id-token: write
        contents: read
      uses: ./.github/workflows/web-cd.yml
      secrets: inherit
      