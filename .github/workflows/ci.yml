name: CI (Test, Build)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]


jobs:
    web-test-and-build:
        name: Web Container - Test and Build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # devへの直プッシュを禁止（githubの無料プランでは設定できなかったため）
            - name: Block direct push to develop
              if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
              run: |
                echo "developブランチへの直プッシュはNG"
                exit 1
            # コードのチェックアウト
            - name: Checkout code
              uses: actions/checkout@v6
            # NodeJsのセットアップ
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "22" # Dockerfileと合わせる
                cache: "npm" # 毎回npm ciしないようにキャッシュ
            # node_modulesのインストール
            - name: Run npm ci
              run: npm ci
            # Jestの実行  
            - name: Run Test
              run: npm test
            # Build
            - name: Run Build
              run: npm run build