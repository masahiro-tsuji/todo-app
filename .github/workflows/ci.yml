name: CI (Test, Build)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]


jobs:
    web-test-and-build:
        name: Web Container - Test and Build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # コードのチェックアウト
            - name: Checkout code
              uses: actions/checkout@v6
            # NodeJsのセットアップ
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "22" # Dockerfileと合わせる
                cache: "npm" # 毎回npm ciしないようにキャッシュ
                cache-dependency-path: web/package-lock.json
            # node_modulesのインストール
            - name: Run npm ci
              working-directory: web
              run: npm ci
            # Jestの実行  
            - name: Run Test
              working-directory: web
              run: npm test
            # Build
            - name: Run Build
              working-directory: web
              run: npm run build