name: INFRA CI (Test, Build, Synth) / CD

on:
  push:
    branches: ['develop']
    paths:
      - infra/**
      - backend/**
  pull_request:
    branches: ['develop']
    paths:
      - infra/**
      - backend/**

jobs:
  infra-test-and-build:
    name: INFRA - Test, Build, Synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # コードのチェックアウト
      - name: Checkout code
        uses: actions/checkout@v6
      # NodeJsのセットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: | 
            infra/package-lock.json
            backend/todos/package-lock.json
      # node_modulesのインストール
      - name: Run npm ci in infra
        working-directory: infra
        run: npm ci
      - name: Run npm ci in backend
        working-directory: backend/todos
        run: npm ci
      # Biome実行
      - name: Run Infra Lint
        working-directory: infra
        run: npm run lint
      - name: Run Backend Lint
        working-directory: backend/todos
        run: npm run lint
      # Build
      - name: Run Build
        working-directory: infra
        run: npm run build
      # Jestの実行
      - name: Run Infra Test
        working-directory: infra
        run: npm test
      - name: Run Backend Test
        working-directory: backend/todos
        run: npm test
      # TS型チェック→CloudFormationテンプレートの生成
      - name: Check CDK Code
        working-directory: infra
        run: npm run cdk -- synth
  infra-deploy:
    name: Develop Branch Deploy
    needs: infra-test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/infra-cd.yml
    secrets: inherit # Secretsを呼び出し側に継承する
  