services:
  # 開発用
  dev:
    build:
      context: . # 現在のディレクトリのDockerfileを指定
      target: dev # Dockerfileの 「as dev」までを実行
    container_name: todo-dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app # ホストの web/ を /app に同期（ソース変更を即反映）
      - /app/node_modules # ホストの node_modules で上書きせず、コンテナ（npm ci）の依存関係を使う
      - /app/.next # ホスト側の古い .next を読まず、コンテナ専用キャッシュを使う
    environment:
      - WATCHPACK_POLLING=true # ホットリロードの設定
    command: npm run dev # compose 側で dev サーバー起動（Dockerfile dev に CMD なし）

# 今回は CloudFront + S3 の構成にしたため下記は使用しない
  # 本番用
  prod:
    build:
      context: .
      target: prod
    container_name: todo-prod
    ports:
      - '8080:3000'
